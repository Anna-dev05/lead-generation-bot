services:
  - type: worker
    name: telegram-lead-bot
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: GOOGLE_CREDS_PATH
        sync: false
      - key: SHEET_ID
        sync: false
      - key: SHEET_NAME
        sync: false
